version: 1
project: consumer-credit-default-risk-monitoring
status: planned
milestones:
  - id: M0
    title: Approve source, scope, and protected-attribute policy
    status: complete
    acceptance:
      - Approve UCI CC BY 4.0 acquisition and attribution.
      - Confirm demographic fields are excluded from all model inputs and decision outputs.
      - Confirm local-only storage, no GitHub, no deployment, and no lending-decision use.
  - id: M1
    title: Acquire and validate the source
    status: complete
    acceptance:
      - Record source URL, license, DOI, checksum, schema, row count, and acquisition date.
      - Keep raw data ignored and outside public artifacts.
      - Fail closed on schema drift, missing target, duplicate IDs, or invalid ranges.
  - id: M2
    title: Build leakage-safe data and baseline
    status: complete
    acceptance:
      - Define point-in-time feature policy and reproducible train/validation/test split.
      - Establish interpretable baseline and calibrated challenger without demographic inputs.
  - id: M3
    title: Evaluate model, threshold, and fairness diagnostics
    status: complete
    acceptance:
      - Report AUROC, PR-AUC, Brier score, calibration error, threshold trade-offs, and confidence intervals.
      - Perform documented fairness diagnostics only where legally and technically appropriate.
      - Record limitations and prohibit operational credit decisions.
  - id: M4
    title: Build the local analyst workflow
    status: complete
    acceptance:
      - Provide aggregate portfolio monitoring, model card, data-quality states, and a no-decision boundary.
      - Verify accessible loading, empty, error, and refusal states.
  - id: M5
    title: Verify release readiness
    status: complete
    acceptance:
      - Tests, evaluation, documentation, architecture, cost, and evidence records are current.
      - A release decision is prepared without creating public exposure.
  - id: M6
    title: Provision and verify public aggregate-only showcase
    status: complete
    acceptance:
      - Record repository, Neon, Cloudflare, and public-release approval with owner, rollback, and teardown decisions.
      - Verify private repository, database roles, migration, aggregate release, direct Cloudflare Pages deployment, and public production URL. Record that GitHub-required branch protection is unavailable for the current private free-plan repository.
      - Confirm public responses contain no raw data, identifiers, protected attributes, model binaries, or decision outputs.
  - id: M7
    title: Harden the manual release control
    status: complete
    acceptance:
      - A local pre-release gate validates tests, build, aggregate release artifact, and forbidden public fields.
      - A release checklist and credential-free release log trace the deployed release to its source revision and aggregate artifact.
      - The compensating control for unavailable private-repository branch protection is documented and verified.
  - id: M8
    title: Build the authorized full-record analyst product
    status: complete
    acceptance:
      - Generate a checksum-traceable public artifact containing all licensed UCI source rows.
      - Provide a responsive analyst workspace with full-record search, filtering, pagination, and record inspection.
      - Retain the academic-benchmark and no-automated-decision boundaries.
  - id: M9
    title: Add privacy-preserving availability safeguards
    status: unblocked
    acceptance:
      - Verify governed unavailable-state behavior, cache/security headers, rollback diagnostics, and ownership.
      - Do not add monitoring services, scheduled jobs, or paid capacity without approval.
  - id: M10
    title: Package the verified portfolio case study
    status: blocked_by_M9
    acceptance:
      - Public case-study claims link to evidence and retain the retrospective no-decision boundary.
  - id: M11
    title: Exercise rollback and teardown ownership
    status: blocked_by_M10
    acceptance:
      - A non-destructive rollback rehearsal and precise teardown procedure are documented.
