version: 1
evidence:
  - id: DATA-01
    claim: Source provenance, license, checksum, and schema are recorded.
    status: verified
    record: .project/data-manifest.yml
  - id: EVAL-01
    claim: Leakage-safe baseline and challenger performance are reproducible.
    status: verified
    record: artifacts/evaluation.json
  - id: EVAL-02
    claim: Calibration, threshold trade-offs, and fairness diagnostics are documented.
    status: verified
    record: artifacts/evaluation.json
  - id: GOV-01
    claim: The system has no automated lending decision. The local successor publishes no demographic fields in individual records and retains demographics only for aggregate fairness diagnostics.
    status: verified-local
    record: PRODUCT.md, scripts/validate_public_artifact.py, .project/approvals.yml
  - id: PRODUCT-01
    claim: The deployed analyst workspace provides full-record search, filtering, pagination, and complete source-field inspection for all 30,000 UCI rows.
    status: verified
    record: https://consumer-credit-default-risk-monitoring.pages.dev, https://consumer-credit-default-risk-monitoring.pages.dev/data/uci-credit-records.json
  - id: DEPLOY-01
    claim: The public serving path permits aggregate release evidence only and has a documented least-privilege, rollback, and teardown design.
    status: verified
    record: https://consumer-credit-default-risk-monitoring.pages.dev/api/v1/releases/current
  - id: PRODUCT-02
    claim: The local analyst artifact contains 30,000 non-demographic UCI research rows, deterministic derived measures, and out-of-fold retrospective research scores without credentials or model binaries.
    status: verified
    record: scripts/build_public_dataset.py, web/public/data/analyst-workspace.json
  - id: RELCTRL-01
    claim: The manual release path requires a local analyst-artifact pre-release gate and a green GitHub Actions quality run before deployment.
    status: verified
    record: scripts/pre_release_gate.py, docs/RELEASE-CHECKLIST.md, docs/RELEASE-LOG.md
  - id: AVAIL-01
    claim: The local release candidate fails closed on missing or invalid artifacts, verifies database-backed health and release lineage, and applies explicit cache and security-header contracts without third-party monitoring.
    status: verified-local
    record: web/functions/api/v1/health.ts, web/public/_headers, web/src/App.tsx, scripts/verify_live_release.py, docs/AVAILABILITY-RUNBOOK.md
  - id: PRIVACY-01
    claim: The local version-3 analyst artifact excludes sex, education, marriage, and age from public individual records and binds embedded evaluation evidence to a SHA-256 lineage hash.
    status: verified-local
    record: scripts/build_public_dataset.py, scripts/validate_public_artifact.py
