version: 1
evidence:
  - id: DATA-01
    claim: Source provenance, license, checksum, and schema are recorded.
    status: verified
    record: .project/data-manifest.yml
  - id: EVAL-01
    claim: Leakage-safe baseline and challenger performance are reproducible.
    status: verified
    record: artifacts/evaluation.json
  - id: EVAL-02
    claim: Calibration, threshold trade-offs, and fairness diagnostics are documented.
    status: verified
    record: artifacts/evaluation.json
  - id: GOV-01
    claim: The system has no automated lending decision. The deployed product publishes no demographic fields in individual records and retains demographics only for aggregate fairness diagnostics.
    status: verified
    record: PRODUCT.md, scripts/validate_public_artifact.py, .project/approvals.yml, https://consumer-credit-risk-workbench.pages.dev/data/analyst-workspace.json
  - id: PRODUCT-01
    claim: The deployed analyst workspace provides non-demographic search, filtering, pagination, and evidence inspection for all 30,000 UCI rows.
    status: verified
    record: https://consumer-credit-risk-workbench.pages.dev, https://consumer-credit-risk-workbench.pages.dev/data/analyst-workspace.json
  - id: DEPLOY-01
    claim: The public serving path permits aggregate release evidence only and has a documented least-privilege, rollback, and teardown design.
    status: verified
    record: https://consumer-credit-risk-workbench.pages.dev/api/v1/releases/current, docs/RELEASE-LOG.md, docs/AVAILABILITY-RUNBOOK.md
  - id: PRODUCT-02
    claim: The deployed analyst artifact contains 30,000 non-demographic UCI research rows, deterministic derived measures, and out-of-fold retrospective research scores without credentials or model binaries.
    status: verified
    record: scripts/build_public_dataset.py, web/public/data/analyst-workspace.json, https://consumer-credit-risk-workbench.pages.dev/data/analyst-workspace.json
  - id: RELCTRL-01
    claim: The manual release path requires a local analyst-artifact pre-release gate and a green GitHub Actions quality run before deployment.
    status: verified
    record: scripts/pre_release_gate.py, docs/RELEASE-CHECKLIST.md, docs/RELEASE-LOG.md
  - id: AVAIL-01
    claim: The deployed product fails closed on missing or invalid artifacts, verifies database-backed health and release lineage, and applies explicit cache and security-header contracts without third-party monitoring.
    status: verified
    record: web/functions/api/v1/health.ts, web/public/_headers, web/src/App.tsx, scripts/verify_live_release.py, docs/AVAILABILITY-RUNBOOK.md, https://consumer-credit-risk-workbench.pages.dev/api/v1/health
  - id: PRIVACY-01
    claim: The deployed version-3 analyst artifact excludes sex, education, marriage, and age from public individual records and binds embedded evaluation evidence to a SHA-256 lineage hash.
    status: verified
    record: scripts/build_public_dataset.py, scripts/validate_public_artifact.py, scripts/verify_live_release.py, https://consumer-credit-risk-workbench.pages.dev/data/analyst-workspace.json
  - id: M10-DESIGN-01
    claim: The rejected design contract was replaced with an approved-for-local-implementation stakeholder decision map, KPI glossary, chart grammar, interaction contract, responsive rules, accessibility states, and explicit visual deployment gate.
    status: verified_local
    record: DESIGN.md, .project/approvals.yml
  - id: M10-PRODUCT-01
    claim: The local dashboard provides linked portfolio posture, review-capacity, cohort, model-assurance, governance, and record-evidence workflows without protected-attribute individual analytics or lending recommendations.
    status: verified_local
    record: web/src/App.tsx, web/src/analytics.ts, web/src/charts.tsx, web/src/App.test.tsx, web/src/analytics.test.ts
  - id: M10-VERIFY-01
    claim: The local M10 candidate passed 14 web tests, production TypeScript/Vite build, browser interaction checks, zero browser warnings, and 1440px, 834px, and 390px viewport checks without document-level responsive overflow.
    status: verified_local
    record: docs/screenshots/m10/desktop-portfolio.jpg, docs/screenshots/m10/desktop-review-planning.jpg, docs/screenshots/m10/tablet-portfolio.jpg, docs/screenshots/m10/mobile-portfolio.jpg
  - id: M10-PERF-01
    claim: The local production bundle removes the rendered Fluent UI dependency and builds to 255.31 kB JavaScript (76.87 kB gzip) plus 28.11 kB CSS (6.30 kB gzip); combined app assets are 33.3% smaller gzip than the rejected 436.55 kB JavaScript / 4.20 kB CSS baseline.
    status: verified_local
    record: web/package.json, web/src/App.tsx, web/dist/assets
